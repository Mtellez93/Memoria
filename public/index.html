<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Memoria Tablero</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧠</text></svg>">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="setup-menu" class="menu-container">
        <h1>CONFIGURAR</h1>
        <div class="option">
            <label>Tablero:</label>
            <select id="grid-size">
                <option value="4x4">4x4</option>
                <option value="6x4">6x4</option>
                <option value="6x6">6x6</option>
            </select>
        </div>
        <div class="option">
            <label>Jugadores:</label>
            <select id="player-count">
                <option value="1">1</option><option value="2">2</option>
                <option value="3">3</option><option value="4">4</option>
            </select>
        </div>
        <button class="btn-start" onclick="crearSala()">CREAR SALA</button>
    </div>

    <div id="lobby-menu" class="menu-container hidden">
        <h1>SALA</h1>
        <p>Código de lobby:</p>
        <h2 id="lobby-code" class="lobby-code"></h2>
        <img id="qr-image" class="qr-image" alt="QR de sala">
        <p>Abre <strong>/mobil.html</strong> y escribe el código para unirte.</p>
        <div id="player-list" class="lobby-player-list"></div>
        <button id="btn-start-game" class="btn-start" onclick="iniciarPartida()" disabled>INICIAR PARTIDA</button>
    </div>

    <div id="view-tv" class="hidden">
        <div id="scoreboard" class="scoreboard"></div>
        <div id="board" class="grid-board"></div>
        <div id="winner-overlay" class="winner-msg hidden">
            <h2 id="winner-text"></h2>
            <p>Reinicia la sala desde este tablero</p>
            <button class="btn-reset" onclick="resetearTodo()">Reiniciar Todo</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const HOST_STORAGE_KEY = 'memoria-host-id';
        const hostClientId = localStorage.getItem(HOST_STORAGE_KEY) || crypto.randomUUID();
        localStorage.setItem(HOST_STORAGE_KEY, hostClientId);
        let lobbyCode = '';

        socket.on('connect', () => {
            socket.emit('registerClient', { role: 'host', clientId: hostClientId, code: lobbyCode });
        });

        function crearSala() {
            const size = document.getElementById('grid-size').value.split('x');
            socket.emit('createLobby', {
                clientId: hostClientId,
                config: { rows: size[1], cols: size[0], players: document.getElementById('player-count').value }
            });
        }

        function iniciarPartida() {
            if (!lobbyCode) return;
            socket.emit('startGame', { code: lobbyCode });
        }

        function resetearTodo() {
            socket.emit('requestReset');
        }

        socket.on('lobbyCreated', ({ code }) => {
            lobbyCode = code;
            document.getElementById('setup-menu').classList.add('hidden');
            document.getElementById('lobby-menu').classList.remove('hidden');
            document.getElementById('lobby-code').innerText = code;

            const mobileUrl = `${window.location.origin}/mobil.html?code=${encodeURIComponent(code)}`;
            const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(mobileUrl)}`;
            document.getElementById('qr-image').src = qrUrl;
        });

        socket.on('hostRejoined', ({ code }) => {
            lobbyCode = code;
        });

        socket.on('gameUpdate', (state) => {
            if (!state || state.code !== lobbyCode) return;

            if (!state.gameStarted) {
                const canStart = state.players.length === state.config.maxPlayers && state.players.every((p) => p.connected !== false);
                document.getElementById('btn-start-game').disabled = !canStart;
                document.getElementById('player-list').innerHTML =
                    state.players.map((p) => `<div class="player-pill">${p.name}${p.connected === false ? ' (reconectando...)' : ''}</div>`).join('') || '<p>Aún no hay jugadores.</p>';
                return;
            }

            document.getElementById('lobby-menu').classList.add('hidden');
            document.getElementById('view-tv').classList.remove('hidden');
            renderTV(state);
        });

        function renderTV(state) {
            const board = document.getElementById('board');
            const scoreboard = document.getElementById('scoreboard');
            scoreboard.innerHTML = state.players.map((p, i) => `<div class="player-pill ${state.currentPlayerIndex === i ? 'active' : ''}">${p.name}: ${p.score}</div>`).join('');
            board.style.gridTemplateColumns = `50px repeat(${state.config.cols}, 1fr)`;
            board.innerHTML = '<div></div>';
            for(let i=0; i<state.config.cols; i++) board.innerHTML += `<div class="label-ref">${String.fromCharCode(65+i)}</div>`;
            state.cards.forEach((card, index) => {
                if (index % state.config.cols === 0) board.innerHTML += `<div class="label-ref">${Math.floor(index/state.config.cols)+1}</div>`;
                board.innerHTML += `<div class="card ${card.isFlipped ? 'flipped' : ''} ${card.isMatched ? 'matched' : ''}"><div class="card-inner"><div class="card-front"></div><div class="card-back" style="background-image: url('${card.url}')"></div></div></div>`;
            });
        }

        socket.on('gameOver', (players) => {
            const winner = [...players].sort((a, b) => b.score - a.score)[0];
            document.getElementById('winner-text').innerText = `¡GANADOR: ${winner.name.toUpperCase()}!`;
            document.getElementById('winner-overlay').classList.remove('hidden');
        });

        socket.on('goToMenu', () => {
            window.location.reload();
        });
    </script>
</body>
</html>
